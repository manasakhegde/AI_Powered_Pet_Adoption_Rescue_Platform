spring:
  application:
    name: pet-adoption-platform
  
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/pet_adoption_platform}
      database: ${MONGODB_DATABASE:pet_adoption_platform}
      auto-index-creation: true
      # Docker production: mongodb://admin:password@mongodb:27017/pet_adoption_platform?authSource=admin
      # Local development: mongodb://localhost:27017/pet_adoption_platform

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 15MB
  
  jpa:
    open-in-view: false
  
  mvc:
    throw-exception-if-no-handler-found: true
    static-path-pattern: /static/**
  
  resources:
    add-mappings: false

server:
  port: 5000
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

logging:
  level:
    root: INFO
    com.petadoption: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:your-secret-key-change-in-production}
  expiration: 86400000  # 24 hours in milliseconds

# CORS Configuration
cors:
  allowed-origins: http://localhost:3000,http://localhost:3001,http://localhost:5000
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: '*'
  allow-credentials: true
  max-age: 3600

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized
